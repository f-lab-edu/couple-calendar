server:
  port: ${PORT:8080}

spring:
  config:
    # 로컬 개발용 비밀값 주입. 루트(apps/api-kotlin)의 .env.properties 가 있으면 읽고, 없으면 무시.
    # 운영 환경에서는 OS 환경변수(SUPABASE_DB_*, SUPABASE_*)로 주입하면 됨.
    import: optional:file:./.env.properties
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-key: ${SUPABASE_SERVICE_KEY:}

logging:
  level:
    com.couplecalendar: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
